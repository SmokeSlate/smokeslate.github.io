<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>MIDI Track Delay Icon Mapper</title>
  <script src="https://unpkg.com/tone@15.1.22/build/Tone.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tonejs/midi/build/Tone.Midi.min.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen,
        Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
      padding: 1em;
      max-width: 600px;
      margin: auto;
    }
    input, select, button {
      font-size: 1em;
      padding: 0.5em;
      margin: 0.5em 0;
      width: 100%;
      box-sizing: border-box;
    }
    #progress {
      width: 100%;
      height: 20px;
      margin-top: 0.5em;
    }
    .notes-container {
      margin-top: 1em;
      border-top: 1px solid #ccc;
      padding-top: 1em;
    }
    .note-item {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid #eee;
      padding: 0.4em 0;
      align-items: center;
    }
    .delay-icons {
      font-size: 1.3em;
      text-align: center;
      width: 90px;
    }
    .delay-info {
      font-size: 0.9em;
      color: #555;
      width: 150px;
      text-align: right;
    }
    .note-label {
      flex-grow: 1;
    }
    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <h1>MIDI Track Delay Icon Mapper</h1>
  <input type="file" id="midiFile" accept=".mid,.midi" />
  <progress id="progress" value="0" max="100" style="display:none;"></progress>
  <select id="trackSelect" style="display:none;"></select>
  <button id="exportBtn" style="display:none;">Export Notes as JSON</button>
  <div class="notes-container" id="notesContainer"></div>

<script>
  // Your note chart, simplified (only note+octave and paint name)
  // Add more entries from your chart as needed
  const noteChart = [
    { paint: "Turquoise", note: "E3" },
    { paint: "Dark Purple", note: "F3" },
    { paint: "Gray", note: "F#3" },
    { paint: "Blurple", note: "G3" },
    { paint: "Green (formerly Pickle)", note: "G#3" },
    { paint: "Black", note: "A3" },
    { paint: "Light Olive", note: "A#3" },
    { paint: "White (Glowing Red)", note: "B3" },
    { paint: "Light Mocha", note: "C4" },
    { paint: "Dark Red", note: "C#4" },
    { paint: "Red (Glowing Yellow)", note: "D4" },
    { paint: "Mocha", note: "D#4" },
    { paint: "Orange (Glowing Orange)", note: "E4" },
    { paint: "Light Brown", note: "F4" },
    { paint: "Light Yellow (Glowing Green)", note: "F#4" },
    { paint: "Light Teal", note: "G4" },
    { paint: "Olive", note: "G#4" },
    { paint: "Dark Green (Glowing Cyan)", note: "A4" },
    { paint: "Cyan", note: "A#4" },
    { paint: "Dark Blue (Glowing Red / Pink)", note: "B4" },
    { paint: "Light Blue", note: "C5" },
    { paint: "Blue", note: "C#5" },
    { paint: "Purple (Glowing Yellow / Purple)", note: "D5" },
    { paint: "Dark Gray", note: "D#5" },
    { paint: "Brown (Glowing Orange)", note: "E5" },
    { paint: "Lavender", note: "F5" },
    { paint: "Dark Brown (Glowing Green)", note: "F#5" },
    { paint: "Orchid", note: "G5" },
    { paint: "Teal", note: "G#5" },
    { paint: "Pink (Glowing Cyan)", note: "A5" },
    { paint: "Periwinkle", note: "A#5" },
    { paint: "Yellow (Glowing Pink)", note: "B5" },
    { paint: "Light Orange / Macaroni", note: "C6" },
    { paint: "Light Green / Lime Green", note: "C#6" },
    { paint: "(Glowing Purple)", note: "D6" }
  ];

  // Delay types with spaces, icons & BPM for sixteenth note base tempo (simplified)
  const delayTypes = [
    { spaces: 1, icon: "⎯", bpm: 1200 },
    { spaces: 2, icon: "─", bpm: 600 },
    { spaces: 3, icon: "··", bpm: 400 },
    { spaces: 4, icon: "··─", bpm: 300 },
    { spaces: 5, icon: "···", bpm: 240 },
    { spaces: 6, icon: "···─", bpm: 200 },
    { spaces: 7, icon: "····", bpm: 171 },
    { spaces: 8, icon: "····─", bpm: 150 },
    { spaces: 9, icon: "·····", bpm: 133 }
  ];

  const midiFileInput = document.getElementById("midiFile");
  const trackSelect = document.getElementById("trackSelect");
  const notesContainer = document.getElementById("notesContainer");
  const exportBtn = document.getElementById("exportBtn");
  const progressBar = document.getElementById("progress");

  let midiData = null;
  let currentTrackNotes = [];
  let selectedTrackIndex = 0;
  let baseTempo = 120; // default BPM

  // Convert midi number to note name like "C#4"
  function midiToNoteName(midi) {
    const notes = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
    const octave = Math.floor(midi / 12) - 1;
    const note = notes[midi % 12];
    return note + octave;
  }

  // Find closest note paint from chart
  function findClosestPaint(noteName) {
    // Find exact first
    for (const entry of noteChart) {
      if (entry.note === noteName) return entry.paint;
    }
    // If not found exact, find closest by MIDI distance
    // Convert noteName and chart notes to midi number to compare
    function noteToMidi(n) {
      const noteMap = { C:0, 'C#':1, D:2, 'D#':3, E:4, F:5, 'F#':6, G:7, 'G#':8, A:9, 'A#':10, B:11 };
      let match = n.match(/^([A-G]#?)(-?\d)$/);
      if (!match) return null;
      return noteMap[match[1]] + (parseInt(match[2],10) +1)*12;
    }
    const targetMidi = noteToMidi(noteName);
    if (targetMidi === null) return "Unknown";

    let best = null;
    let bestDist = 1000;
    for (const entry of noteChart) {
      let midi = noteToMidi(entry.note);
      if (midi === null) continue;
      let dist = Math.abs(midi - targetMidi);
      if (dist < bestDist) {
        bestDist = dist;
        best = entry.paint;
      }
    }
    return best || "Unknown";
  }

  // Find delay info for a given deltaTime in ticks and ticksPerBeat
  function getDelayInfo(deltaTicks, ticksPerBeat) {
    // Convert deltaTicks to number of spaces based on tempo and ticksPerBeat
    // We approximate "spaces" = closest to deltaTicks / smallest unit
    // Smallest unit is 1 space = one wire block (usually 1 tick if very fast)
    // For demo: spaces = deltaTicks / (ticksPerBeat / 4)  (sixteenth note as base)
    let spaces = Math.round(deltaTicks / (ticksPerBeat / 4));
    if (spaces < 1) spaces = 1;

    // Find closest delay type
    let best = delayTypes[0];
    for (const dt of delayTypes) {
      if (Math.abs(dt.spaces - spaces) < Math.abs(best.spaces - spaces)) {
        best = dt;
      }
    }
    return { spaces: spaces, icon: best.icon, bpm: best.bpm };
  }

  // Process notes of a track
  function processTrack(track) {
    let notesInfo = [];
    let lastTick = 0;

    for (const note of track.notes) {
      let noteName = midiToNoteName(note.midi);
      let paint = findClosestPaint(noteName);

      // Calculate delay spaces from previous note
      let deltaTicks = note.ticks - lastTick;
      let delay = getDelayInfo(deltaTicks, midiData.header.ppq);
      lastTick = note.ticks;

      notesInfo.push({
        midiNote: note.midi,
        midiNoteStr: noteName,
        paint: paint,
        delayIcons: delay.icon.repeat(delay.spaces),
        spaces: delay.spaces,
        bpm: delay.bpm
      });
    }
    return notesInfo;
  }

  // Display notes for selected track
  function displayNotes(notesInfo) {
    notesContainer.innerHTML = "";
    for (const info of notesInfo) {
      const div = document.createElement("div");
      div.className = "note-item";

      const left = document.createElement("div");
      left.className = "note-label";
      left.innerHTML = `<strong>${info.midiNoteStr}</strong> (${info.paint})`;

      const center = document.createElement("div");
      center.className = "delay-icons";
      center.textContent = info.delayIcons;

      const right = document.createElement("div");
      right.className = "delay-info";
      right.textContent = `Delay: ${info.spaces} spaces | ~${info.bpm} BPM`;

      div.appendChild(left);
      div.appendChild(center);
      div.appendChild(right);

      notesContainer.appendChild(div);
    }
  }

  // Handle file input
  midiFileInput.addEventListener("change", async (e) => {
    if (!e.target.files.length) return;
    progressBar.style.display = "block";
    progressBar.value = 0;
    notesContainer.innerHTML = "";
    trackSelect.style.display = "none";
    exportBtn.style.display = "none";

    const file = e.target.files[0];
    try {
      const arrayBuffer = await file.arrayBuffer();

      // Parse MIDI using Tone.Midi
      midiData = new Midi(arrayBuffer);

      // Populate track selector
      trackSelect.innerHTML = "";
      midiData.tracks.forEach((t, i) => {
        const option = document.createElement("option");
        option.value = i;
        option.textContent = `Track ${i + 1} - ${t.name || "Unnamed"}`;
        trackSelect.appendChild(option);
      });
      if(midiData.tracks.length === 0) {
        notesContainer.textContent = "No tracks found in MIDI.";
        progressBar.style.display = "none";
        return;
      }
      selectedTrackIndex = 0;
      trackSelect.style.display = "block";

      // Process and show first track notes
      const notesInfo = processTrack(midiData.tracks[0]);
      displayNotes(notesInfo);
      currentTrackNotes = notesInfo;
      exportBtn.style.display = "inline-block";

      progressBar.style.display = "none";
    } catch (err) {
      notesContainer.textContent = "Error parsing MIDI file: " + err.message;
      progressBar.style.display = "none";
    }
  });

  // Track change handler
  trackSelect.addEventListener("change", () => {
    selectedTrackIndex = parseInt(trackSelect.value);
    const notesInfo = processTrack(midiData.tracks[selectedTrackIndex]);
    displayNotes(notesInfo);
    currentTrackNotes = notesInfo;
  });

  // Export button
  exportBtn.addEventListener("click", () => {
    const jsonStr = JSON.stringify(currentTrackNotes, null, 2);
    const blob = new Blob([jsonStr], { type: "application/json" });
    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = url;
    a.download = `notes_track${selectedTrackIndex + 1}.json`;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => {
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }, 100);
  });
</script>
</body>
</html>
