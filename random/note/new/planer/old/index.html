<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Note Delay Visualizer</title>
    <style>
        :root {
            --small-block: 30px;
            --tiny-block: 15px;
            --gap: 4px;
        }
        
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #1e1e1e;
            color: #f0f0f0;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .note-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .note-card {
            background-color: #2d2d2d;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        
        .note-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px solid #444;
        }
        
        .note-name {
            font-weight: bold;
            font-size: 1.1em;
        }
        
        .delay-ms {
            color: #aaa;
            font-size: 0.9em;
        }
        
        .delay-blocks {
            display: flex;
            flex-wrap: wrap;
            gap: var(--gap);
            margin-top: 10px;
        }
        
        .block {
            background-color: #444;
            border-radius: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.7em;
            font-weight: bold;
            box-sizing: border-box;
        }
        
        .block.small {
            width: var(--small-block);
            height: var(--small-block);
        }
        
        .block.tiny {
            width: var(--tiny-block);
            height: var(--tiny-block);
            font-size: 0.6em;
        }
        
        .block.wire {
            background-color: #333;
            border: 1px dashed #666;
        }
        
        h1 {
            text-align: center;
            color: #f0f0f0;
            margin-bottom: 30px;
        }
        
        .controls {
            margin: 20px 0;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
        }
        
        button {
            padding: 8px 15px;
            background-color: #4a6da7;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        
        button:hover {
            background-color: #5a7db7;
        }
        
        .block-size-control {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        input[type="range"] {
            width: 150px;
        }
        
        .file-upload {
            position: relative;
            display: inline-block;
        }
        
        .file-upload input[type="file"] {
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }
        
        .file-name {
            margin-left: 10px;
            color: #aaa;
            font-size: 0.9em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 150px;
            display: inline-block;
            vertical-align: middle;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Note Delay Visualizer</h1>
        
        <div class="controls">
            <div class="file-upload">
                <button id="uploadBtn">Upload JSON File</button>
                <input type="file" id="fileInput" accept=".json" />
                <span id="fileName" class="file-name"></span>
            </div>
            <button id="toggleColors">Toggle Glow Effects</button>
            <div class="block-size-control">
                <span>Block Size:</span>
                <input type="range" id="blockSize" min="10" max="50" value="30">
            </div>
            <div class="block-size-control">
                <span>Gap Size:</span>
                <input type="range" id="gapSize" min="1" max="10" value="4">
            </div>
        </div>
        
        <div id="noteContainer" class="note-grid">
            <!-- Notes will be inserted here by JavaScript -->
        </div>
    </div>

    <script>
        // Color mapping based on the provided chart
        const colorMap = {
            // Format: "Note (Octave)": { color: "#hex", glow: "#hex" },
            "E3": { color: "#025E4C" },
            "F3": { color: "#292A3A" },
            "F#3": { color: "#BDBFC5" },
            "Gb3": { color: "#BDBFC5" },
            "G3": { color: "#3164AF" },
            "G#3": { color: "#167325" },
            "Ab3": { color: "#167325" },
            "A3": { color: "#121212" },
            "A#3": { color: "#679C43" },
            "Bb3": { color: "#679C43" },
            "B3": { color: "#FFFFFF", glow: "#FF4655" },
            "C4": { color: "#A26550" },  // Light Mocha
            "C#4": { color: "#54393C" }, // Dark Red
            "Db4": { color: "#54393C" },
            "D4": { color: "#DF5454", glow: "#FFFEFA" }, // Red (Glowing Yellow)
            "D#4": { color: "#89462E" }, // Mocha
            "Eb4": { color: "#89462E" },
            "E4": { color: "#DF6F54", glow: "#FFB45A" }, // Orange (Glowing Orange)
            "F4": { color: "#B79C91" }, // Light Brown
            "F#4": { color: "#F6C68D", glow: "#AFFD9D" }, // Light Yellow (Glowing Green)
            "Gb4": { color: "#F6C68D", glow: "#AFFD9D" },
            "G4": { color: "#5DC9A0" }, // Light Teal
            "G#4": { color: "#44682B" }, // Olive
            "Ab4": { color: "#44682B" },
            "A4": { color: "#2D594F", glow: "#00FFFF" }, // Dark Green (Glowing Cyan)
            "A#4": { color: "#5DC6CA" }, // Cyan
            "Bb4": { color: "#5DC6CA" },
            "B4": { color: "#576077", glow: "#FF4655" }, // Dark Blue (Glowing Red / Pink)
            "C5": { color: "#82BADF" }, // Light Blue
            "C#5": { color: "#5D6BBD" }, // Blue
            "Db5": { color: "#5D6BBD" },
            "D5": { color: "#735FB0", glow: "#FFFEFA" }, // Purple (Glowing Yellow / Purple)
            "D#5": { color: "#7F8185" }, // Dark Gray
            "Eb5": { color: "#7F8185" },
            "E5": { color: "#91776B", glow: "#FFB45A" }, // Brown (Glowing Orange)
            "F5": { color: "#927FDE" }, // Lavender
            "F#5": { color: "#423732", glow: "#AFFD9D" }, // Dark Brown (Glowing Green)
            "Gb5": { color: "#423732", glow: "#AFFD9D" },
            "G5": { color: "#D377C4" }, // Orchid
            "G#5": { color: "#105F6B" }, // Teal
            "Ab5": { color: "#105F6B" },
            "A5": { color: "#DA89AC", glow: "#00FFFF" }, // Pink (Glowing Cyan)
            "A#5": { color: "#A192CE" }, // Periwinkle
            "Bb5": { color: "#A192CE" },
            "B5": { color: "#F7C332", glow: "#FFADFF" }, // Yellow (Glowing Pink)
            "C6": { color: "#E09E54" }, // Light Orange / Macaroni
            "C#6": { color: "#83BB45" }, // Light Green / Lime Green
            "Db6": { color: "#83BB45" },
            "D6": { glow: "#D567FF" } // (Glowing Purple)
        };

        // Sample data - in a real app, this would come from an API or file
        let notesData = [];

        // Fetch the notes data from the JSON file
        async function loadNotesData() {
            try {
                const response = await fetch('mapped_notes.json');
                notesData = await response.json();
                renderNotes();
            } catch (error) {
                console.error('Error loading notes data:', error);
                // Fallback to sample data if loading fails
                notesData = [
                    // Sample data structure
                    {
                        noteName: "C4",
                        mappedName: "Light Mocha",
                        delayMs: 17778,
                        delayBlocks: ["Small", "Small", "Tiny", "Tiny"]
                    },
                    {
                        noteName: "D#4",
                        mappedName: "Mocha",
                        delayMs: 18056,
                        delayBlocks: ["Small", "Small", "Small", "Tiny"]
                    }
                ];
                renderNotes();
            }
        }


        function renderNotes() {
            const container = document.getElementById('noteContainer');
            container.innerHTML = ''; // Clear existing content

            notesData.forEach(note => {
                const noteCard = document.createElement('div');
                noteCard.className = 'note-card';
                
                const colorInfo = colorMap[note.noteName] || { color: '#777777' };
                
                // Set the card's border color based on the note
                noteCard.style.borderLeft = `4px solid ${colorInfo.color}`;
                
                // Add glowing effect if available
                if (colorInfo.glow) {
                    noteCard.style.boxShadow = `0 0 10px ${colorInfo.glow}`;
                    noteCard.classList.add('has-glow');
                }

                // Create header with note info
                const header = document.createElement('div');
                header.className = 'note-header';
                
                const noteInfo = document.createElement('div');
                noteInfo.className = 'note-info';
                
                const noteName = document.createElement('div');
                noteName.className = 'note-name';
                noteName.textContent = `${note.noteName} - ${note.mappedName}`;
                
                const delayMs = document.createElement('div');
                delayMs.className = 'delay-ms';
                delayMs.textContent = `${(note.delayMs / 1000).toFixed(2)}s`;
                
                noteInfo.appendChild(noteName);
                noteInfo.appendChild(delayMs);
                
                // Create color swatch
                const colorSwatch = document.createElement('div');
                colorSwatch.className = 'color-swatch';
                colorSwatch.style.width = '20px';
                colorSwatch.style.height = '20px';
                colorSwatch.style.backgroundColor = colorInfo.color;
                colorSwatch.style.borderRadius = '3px';
                colorSwatch.style.border = '1px solid #444';
                colorSwatch.title = colorInfo.color;
                
                header.appendChild(noteInfo);
                header.appendChild(colorSwatch);
                
                // Create delay blocks
                const delayBlocks = document.createElement('div');
                delayBlocks.className = 'delay-blocks';
                
                note.delayBlocks.forEach((block, index) => {
                    const blockEl = document.createElement('div');
                    blockEl.className = `block ${block.toLowerCase()}`;
                    blockEl.textContent = block[0]; // First letter of block type
                    blockEl.title = block;
                    
                    // Special handling for wire blocks
                    if (block === 'Wire') {
                        blockEl.textContent = 'W';
                        blockEl.classList.add('wire');
                    }
                    
                    delayBlocks.appendChild(blockEl);
                });
                
                // Assemble the card
                noteCard.appendChild(header);
                noteCard.appendChild(delayBlocks);
                
                // Add to container
                container.appendChild(noteCard);
            });
            
            updateBlockSizes();
        }
        
        function updateBlockSizes() {
            const smallSize = document.getElementById('blockSize').value;
            const gapSize = document.getElementById('gapSize').value;
            
            document.documentElement.style.setProperty('--small-block', `${smallSize}px`);
            document.documentElement.style.setProperty('--tiny-block', `${smallSize / 2}px`);
            document.documentElement.style.setProperty('--gap', `${gapSize}px`);
        }
        
        function toggleGlowEffects() {
            document.body.classList.toggle('no-glow');
        }
        
        // Handle file upload
        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            // Update file name display
            const fileName = document.getElementById('fileName');
            fileName.textContent = file.name;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    if (Array.isArray(data)) {
                        notesData = data;
                        renderNotes();
                    } else {
                        alert('Invalid JSON format. Expected an array of note objects.');
                    }
                } catch (error) {
                    console.error('Error parsing JSON:', error);
                    alert('Error parsing JSON file. Please check the file format.');
                }
            };
            reader.onerror = function() {
                alert('Error reading file');
            };
            reader.readAsText(file);
        }
        
        // Initialize the page
        document.addEventListener('DOMContentLoaded', () => {
            loadNotesData();
            
            // Add event listeners for controls
            document.getElementById('toggleColors').addEventListener('click', toggleGlowEffects);
            document.getElementById('blockSize').addEventListener('input', updateBlockSizes);
            document.getElementById('gapSize').addEventListener('input', updateBlockSizes);
            document.getElementById('fileInput').addEventListener('change', handleFileUpload);
        });
    </script>
</body>
</html>
