<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MIDI Timeline Mapper with Chords (Yeeps)</title>
    <style>
      :root {
        --primary: #007bff;
        --secondary: #17a2b8;
        --background: #f4f4f8;
        --surface: #ffffff;
        --text: #333333;
        --border: #dddddd;
        --danger: #ff3b30;
        --muted: rgba(0, 0, 0, 0.06);
        --muted2: rgba(0, 0, 0, 0.03);
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
        background: var(--background);
        color: var(--text);
        margin: 0;
        padding: 1rem;
        transition: background 0.3s ease, color 0.3s ease;
      }
      body.dark {
        --background: #121212;
        --surface: #1e1e1e;
        --text: #e6e6e6;
        --border: #333333;
        --muted: rgba(255, 255, 255, 0.08);
        --muted2: rgba(255, 255, 255, 0.04);
      }
      h1 {
        margin: 0 0 0.75rem 0;
        text-align: center;
        font-size: 1.35rem;
        letter-spacing: 0.2px;
      }
      .panel {
        width: 100%;
        margin: 0;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 0.9rem;
        box-shadow: 0 6px 16px rgba(0, 0, 0, 0.3);
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        align-items: center;
        justify-content: center;
        margin: 0.6rem 0;
      }
      label {
        margin-right: 0.25rem;
        font-weight: 600;
        opacity: 0.9;
      }
      input[type="number"],
      input[type="text"],
      select {
        padding: 0.55rem 0.6rem;
        border-radius: 10px;
        border: 1px solid var(--border);
        font-size: 1rem;
        background: var(--surface);
        color: var(--text);
        outline: none;
      }
      input[type="file"] {
        font-size: 1rem;
        padding: 0.35rem;
      }
      button {
        background: var(--primary);
        color: #fff;
        border: none;
        border-radius: 12px;
        padding: 0.55rem 0.95rem;
        font-size: 1rem;
        cursor: pointer;
        transition: transform 0.05s ease, filter 0.2s ease, opacity 0.2s ease;
        user-select: none;
      }
      button:active {
        transform: translateY(1px);
      }
      button:hover:not(:disabled) {
        filter: brightness(0.92);
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 0.45rem;
        padding: 0.42rem 0.7rem;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: var(--muted2);
        font-size: 0.95rem;
        white-space: nowrap;
      }
      .pill strong {
        font-weight: 800;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        align-items: center;
        justify-content: center;
        margin: 0.35rem 0 0.65rem 0;
      }
      .instrument-list {
        display: flex;
        flex-direction: column;
        gap: 0.45rem;
        max-width: 920px;
        margin: 0.35rem auto 0.65rem auto;
      }
      .instrument-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.45rem;
        background: var(--muted2);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 0.5rem 0.65rem;
      }
      .instrument-name {
        flex: 1 1 180px;
        min-width: 160px;
      }
      .mini-btn {
        padding: 0.4rem 0.65rem;
        font-size: 0.9rem;
      }
      .sep {
        height: 1px;
        background: var(--border);
        opacity: 0.9;
        margin: 0.75rem 0;
      }
      /* ===== Timeline ===== */
      .timeline-shell {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 14px;
        overflow: hidden;
        background: linear-gradient(to bottom, var(--muted2), transparent);
      }
      .timeline-top {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 0.65rem;
        padding: 0.65rem 0.65rem 0.55rem 0.65rem;
        background: var(--muted2);
        border-bottom: 1px solid var(--border);
      }
      .timeline-top .left,
      .timeline-top .right {
        display: flex;
        flex-wrap: wrap;
        gap: 0.45rem;
        align-items: center;
      }
      .timeline {
        position: relative;
        height: calc(100vh - 280px);
        min-height: 400px;
        background: linear-gradient(
          to bottom,
          rgba(0, 0, 0, 0.05),
          rgba(0, 0, 0, 0)
        );
      }
      body.dark .timeline {
        background: linear-gradient(
          to bottom,
          rgba(255, 255, 255, 0.06),
          rgba(255, 255, 255, 0)
        );
      }
      .grid {
        position: absolute;
        inset: 0;
        pointer-events: none;
        opacity: 0.55;
        background-image: linear-gradient(
            to right,
            rgba(0, 0, 0, 0.1) 1px,
            transparent 1px
          ),
          linear-gradient(to bottom, rgba(0, 0, 0, 0.06) 1px, transparent 1px);
        background-size: 48px 100%, 100% 44px;
      }
      body.dark .grid {
        background-image: linear-gradient(
            to right,
            rgba(255, 255, 255, 0.1) 1px,
            transparent 1px
          ),
          linear-gradient(
            to bottom,
            rgba(255, 255, 255, 0.08) 1px,
            transparent 1px
          );
      }
      .lanes {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .lane {
        position: absolute;
        left: 0;
        right: 0;
        height: 1px;
        background: var(--border);
        opacity: 0.35;
      }
      .notes {
        position: absolute;
        inset: 0;
      }
      /* note tick */
      .tick {
        position: absolute;
        width: 10px;
        height: 10px;
        border-radius: 999px;
        transform: translate(-50%, -50%);
        box-shadow: 0 6px 14px rgba(0, 0, 0, 0.18);
        cursor: pointer;
        border: 1px solid rgba(0, 0, 0, 0.18);
      }
      body.dark .tick {
        border: 1px solid rgba(255, 255, 255, 0.18);
      }
      .tick.selected {
        outline: 3px solid rgba(0, 123, 255, 0.22);
        outline-offset: 2px;
        transform: translate(-50%, -50%) scale(1.06);
      }
      .delay-line {
        position: absolute;
        height: 2px;
        transform: translateY(-50%);
        opacity: 0.55;
        border-radius: 999px;
        pointer-events: none;
      }
      .playhead {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 2px;
        background: var(--danger);
        transform: translateX(-1px);
        pointer-events: none;
        opacity: 0.95;
        box-shadow: 0 0 0 2px rgba(255, 59, 48, 0.12);
      }

      /* Hold bar showing note duration */
      .hold-bar {
        position: absolute;
        height: 4px;
        border-radius: 2px;
        opacity: 0.5;
        pointer-events: none;
      }
      .tooltip {
        position: absolute;
        padding: 0.45rem 0.55rem;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text);
        font-size: 0.9rem;
        box-shadow: 0 14px 32px rgba(0, 0, 0, 0.14);
        pointer-events: none;
        opacity: 0;
        transform: translate(-50%, -10px);
        transition: opacity 0.12s ease, transform 0.12s ease;
        white-space: nowrap;
        z-index: 50;
      }
      .tooltip.show {
        opacity: 1;
        transform: translate(-50%, -16px);
      }
      /* ===== Bottom control strip ===== */
      .timeline-bottom {
        padding: 0.65rem;
        border-top: 1px solid var(--border);
        background: var(--muted2);
      }
      .range {
        display: flex;
        flex-wrap: wrap;
        gap: 0.55rem;
        align-items: center;
        justify-content: center;
        margin: 0.2rem 0 0.55rem 0;
      }
      input[type="range"] {
        width: min(680px, 86vw);
      }
      .hint {
        text-align: center;
        opacity: 0.85;
        font-size: 0.92rem;
        margin-top: 0.45rem;
      }
      .kbd {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
          "Liberation Mono", "Courier New", monospace;
        border: 1px solid var(--border);
        border-bottom-width: 3px;
        border-radius: 8px;
        padding: 0.1rem 0.4rem;
        background: var(--surface);
        font-size: 0.88rem;
      }
    </style>
  </head>
  <body class="dark">
    <h1>MIDI Timeline Mapper with Chords (Yeeps)</h1>
    <div class="panel">
      <div class="controls">
        <input type="file" id="midiFile" accept=".mid" />
        <span class="pill"
          ><label for="bpmInput">BPM</label>
          <input
            type="number"
            id="bpmInput"
            value="120"
            min="30"
            max="300"
            step="1"
            style="width: 92px"
          />
        </span>
        <button id="applyBpm">Apply</button>
      </div>
      <div class="controls">
        <span class="pill">
          <label for="trackMode">Mode</label>
          <select id="trackMode">
            <option value="single" selected>Single Track</option>
            <option value="all">All Tracks</option>
            <option value="instruments">Instruments</option>
          </select>
        </span>
        <span class="pill">
          <label for="trackSelect">Track</label>
          <select id="trackSelect"></select>
        </span>
        <!-- Chord mode selector -->
        <span class="pill">
          <label for="chordMode">Chords</label>
          <select id="chordMode">
            <option value="off" selected>Off</option>
            <option value="on">On</option>
          </select>
        </span>
        <button id="previewBtn" disabled>Preview</button>
        <button id="playBtn" disabled>Play</button>
        <button id="exportBtn" disabled>Export JSON</button>
        <button id="clearBtn" disabled>Clear</button>
      </div>
      <div class="controls" id="instrumentControls" style="display: none">
        <span class="pill"><strong>Instruments</strong></span>
        <button id="addInstrumentBtn" class="mini-btn" disabled>
          Add Instrument
        </button>
      </div>
      <div
        class="instrument-list"
        id="instrumentList"
        style="display: none"
      ></div>
      <div class="row" id="infoRow" style="display: none">
        <span class="pill"
          ><strong>Delay Pattern</strong>: <span id="delayPattern"></span
        ></span>
        <span class="pill"
          ><strong>Note Value</strong>: <span id="noteValue"></span
        ></span>
        <span class="pill"
          ><strong>Notes</strong>: <span id="noteCount">0</span></span
        >
      </div>
      <div class="sep"></div>
      <div class="timeline-shell">
        <div class="timeline-top">
          <div class="left">
            <span class="pill"><strong>Timeline</strong></span>
            <span class="pill">Zoom: <span id="tlZoomLabel">1.0×</span></span>
            <span class="pill">Window: <span id="tlWindow">0.00s</span></span>
            <span class="pill">Time: <span id="tlTime">0.00s</span></span>
            <span class="pill"
              >Selected: <span id="tlSelected">None</span></span
            >
          </div>
          <div class="right">
            <button id="tlZoomOut">−</button>
            <button id="tlZoomIn">+</button>
            <button id="tlStepBack" title="Previous note">◀</button>
            <button id="tlStepFwd" title="Next note">▶</button>
            <button id="tlReset">Reset</button>
          </div>
        </div>
        <div class="timeline" id="timeline">
          <div class="grid"></div>
          <div class="lanes" id="lanes"></div>
          <div class="notes" id="timelineNotes"></div>
          <div class="playhead" id="playhead" style="left: 0"></div>
          <div class="tooltip" id="tlTip"></div>
        </div>
        <div class="timeline-bottom">
          <div class="range">
            <label for="tlZoom"><span class="kbd">Wheel</span> Zoom</label>
            <input
              type="range"
              id="tlZoom"
              min="1"
              max="20"
              value="1"
              step="1"
            />
            <span class="pill"
              >Start: <span id="tlStartLabel">0.00s</span></span
            >
          </div>
          <div class="range">
            <label for="tlScrub"><span class="kbd">Click</span> Seek</label>
            <input
              type="range"
              id="tlScrub"
              min="0"
              max="1000"
              value="0"
              step="1"
            />
            <span class="pill"
              >Duration: <span id="tlDuration">0.00s</span></span
            >
          </div>
          <div class="hint">
            Drag timeline to pan. Keys:
            <span class="kbd">Space</span> play/pause,
            <span class="kbd">←</span>/<span class="kbd">→</span> step notes,
            <span class="kbd">Esc</span> clear selection.
          </div>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@tonejs/midi@2.0.27/build/Midi.min.js"></script>
    <script>
      // ===== Colour chart based on Yeeps note block table (paintHex from wiki)
      const paintHex = {
        "Dark Maroon": "#352A2A",
        Turquoise: "#38886D",
        "Dark Purple": "#36394C",
        Gray: "#BCBFC4",
        Blurple: "#3264AF",
        Green: "#469740",
        Black: "#121212",
        "Light Olive": "#689C43",
        White: "#F5F5F5",
        "Light Mocha": "#A16550",
        "Dark Red": "#54393C",
        Red: "#DF5454",
        Mocha: "#89462D",
        Orange: "#DF6F54",
        "Light Brown": "#B79C91",
        "Light Yellow": "#F5C68D",
        "Light Teal": "#5EC9A0",
        Olive: "#466A2D",
        "Dark Green": "#2D594F",
        Cyan: "#5EC6C9",
        "Dark Blue": "#576077",
        "Light Blue": "#82B9DF",
        Blue: "#5D6BBD",
        Purple: "#735FB0",
        "Dark Gray": "#77797B",
        Brown: "#91776B",
        Lavender: "#927FDE",
        "Dark Brown": "#423732",
        Orchid: "#D378C4",
        Teal: "#387D88",
        Pink: "#DB89AC",
        Periwinkle: "#C1B4F9",
        Yellow: "#F7C331",
        Guac: "#E3F06D",
        Lime: "#83BB44",
        Maroon: "#9D4141",
        Beige: "#E2C5A0",
        "Light Orange": "#DF9E54",
      };
      // Map MIDI note names to Yeeps paint names
      const noteChart = {
        E3: "Turquoise",
        F3: "Dark Purple",
        "F#3": "Gray",
        Gb3: "Gray",
        G3: "Blurple",
        "G#3": "Green",
        Ab3: "Green",
        A3: "Black",
        "A#3": "Light Olive",
        Bb3: "Light Olive",
        B3: "White",
        C4: "Light Mocha",
        "C#4": "Dark Red",
        Db4: "Dark Red",
        D4: "Red",
        "D#4": "Mocha",
        Eb4: "Mocha",
        E4: "Orange",
        F4: "Light Brown",
        "F#4": "Light Yellow",
        Gb4: "Light Yellow",
        G4: "Light Teal",
        "G#4": "Olive",
        Ab4: "Olive",
        A4: "Dark Green",
        "A#4": "Cyan",
        Bb4: "Cyan",
        B4: "Dark Blue",
        C5: "Light Blue",
        "C#5": "Blue",
        Db5: "Blue",
        D5: "Purple",
        "D#5": "Dark Gray",
        Eb5: "Dark Gray",
        E5: "Brown",
        F5: "Lavender",
        "F#5": "Dark Brown",
        Gb5: "Dark Brown",
        G5: "Orchid",
        "G#5": "Teal",
        Ab5: "Teal",
        A5: "Pink",
        "A#5": "Periwinkle",
        Bb5: "Periwinkle",
        B5: "Yellow",
        C6: "Light Orange",
        "C#6": "Lime",
        Db6: "Lime",
        D6: "Maroon",
        "D#6": "Beige",
        Eb6: "Beige",
        E6: "Light Orange", // Note block "Macaroni" alias removed
      };
      const midiNoteToName = (n) => {
        const names = [
          "C",
          "C#",
          "D",
          "D#",
          "E",
          "F",
          "F#",
          "G",
          "G#",
          "A",
          "A#",
          "B",
        ];
        return names[n % 12] + (Math.floor(n / 12) - 1);
      };
      const delayChart = { Big: 200, Small: 20, Tiny: 2, Wire: 1 };
      // BPM pattern info (for UI only)
      const patterns = [
        { spaces: 1, bpm: 1200, pattern: ["Wire"] },
        { spaces: 2, bpm: 600, pattern: ["Wire", "Wire"] },
        { spaces: 3, bpm: 400, pattern: ["Wire", "Tiny"] },
        { spaces: 4, bpm: 300, pattern: ["Wire", "Tiny", "Wire"] },
        { spaces: 5, bpm: 240, pattern: ["Wire", "Tiny", "Tiny"] },
        { spaces: 6, bpm: 200, pattern: ["Wire", "Tiny", "Wire", "Tiny"] },
        { spaces: 7, bpm: 171, pattern: ["Wire", "Tiny", "Tiny", "Tiny"] },
        {
          spaces: 8,
          bpm: 150,
          pattern: ["Wire", "Tiny", "Tiny", "Tiny", "Wire"],
        },
        {
          spaces: 9,
          bpm: 133,
          pattern: ["Wire", "Tiny", "Tiny", "Tiny", "Tiny"],
        },
      ];
      function calculateOptimalPattern(bpm) {
        let best = patterns[0];
        for (const p of patterns) {
          if (bpm <= p.bpm) best = p;
          else break;
        }
        return best;
      }
      // ===== Elements =====
      const midiFileInput = document.getElementById("midiFile");
      const bpmInput = document.getElementById("bpmInput");
      const applyBpmBtn = document.getElementById("applyBpm");
      const trackMode = document.getElementById("trackMode");
      const trackSelect = document.getElementById("trackSelect");
      const instrumentControls = document.getElementById("instrumentControls");
      const addInstrumentBtn = document.getElementById("addInstrumentBtn");
      const instrumentListEl = document.getElementById("instrumentList");
      const chordModeSelect = document.getElementById("chordMode");
      const previewBtn = document.getElementById("previewBtn");
      const playBtn = document.getElementById("playBtn");
      const exportBtn = document.getElementById("exportBtn");
      const clearBtn = document.getElementById("clearBtn");
      const infoRow = document.getElementById("infoRow");
      const delayPatternEl = document.getElementById("delayPattern");
      const noteValueEl = document.getElementById("noteValue");
      const noteCountEl = document.getElementById("noteCount");
      const lanesEl = document.getElementById("lanes");
      const timelineEl = document.getElementById("timeline");
      const timelineNotesEl = document.getElementById("timelineNotes");
      const playheadEl = document.getElementById("playhead");
      const tlTip = document.getElementById("tlTip");
      const tlZoom = document.getElementById("tlZoom");
      const tlZoomLabel = document.getElementById("tlZoomLabel");
      const tlWindowEl = document.getElementById("tlWindow");
      const tlTimeEl = document.getElementById("tlTime");
      const tlSelectedEl = document.getElementById("tlSelected");
      const tlStartLabel = document.getElementById("tlStartLabel");
      const tlDurationEl = document.getElementById("tlDuration");
      const tlScrub = document.getElementById("tlScrub");
      const tlZoomInBtn = document.getElementById("tlZoomIn");
      const tlZoomOutBtn = document.getElementById("tlZoomOut");
      const tlStepBackBtn = document.getElementById("tlStepBack");
      const tlStepFwdBtn = document.getElementById("tlStepFwd");
      const tlResetBtn = document.getElementById("tlReset");
      // ===== State =====
      let currentMidi = null;
      let tracksAbsNotes = [];
      let currentSelectedTrackIdx = 0;
      let instruments = [];
      let instrumentIdCounter = 1;
      let currentMappedNotes = []; // For mapping and timeline groups (notes or chords)
      let mappedStartTimes = [];
      let mappedDuration = 0.001;
      let zoom = 1;
      let windowStart = 0;
      let windowDuration = 0.001;
      let selectedIndex = -1;
      let dragging = false;
      let dragStartX = 0;
      let dragStartWindowStart = 0;
      // Audio state
      let audioCtx = null;
      let scheduledOscs = [];
      let scheduledTimeouts = [];
      let previewOscs = [];
      let previewTimeouts = [];
      let playing = false;
      let previewPlaying = false;
      let rafId = null;
      // ===== Helper functions =====
      function clamp(v, a, b) {
        return Math.max(a, Math.min(b, v));
      }
      function clampInt(v, a, b) {
        return Math.max(a, Math.min(b, v | 0));
      }
      function fmt(s) {
        return (Math.round(s * 100) / 100).toFixed(2) + "s";
      }
      function getBpm() {
        const bpm = clampInt(parseInt(bpmInput.value, 10) || 120, 30, 300);
        bpmInput.value = String(bpm);
        return bpm;
      }
      function updateBpmInfo() {
        const bpm = getBpm();
        const p = calculateOptimalPattern(bpm);
        delayPatternEl.textContent = p.pattern
          .map((b) =>
            b === "Wire"
              ? "⬛"
              : b === "Tiny"
              ? "🟩"
              : b === "Small"
              ? "🟦"
              : "🟪"
          )
          .join(" ");
        noteValueEl.textContent = `1/${p.spaces} note at ${bpm} BPM`;
        infoRow.style.display = "flex";
      }
      // ===== Instrument helpers =====
      function ensureInstrumentTrackIndex(idx) {
        const maxIdx = Math.max(0, tracksAbsNotes.length - 1);
        return clampInt(idx, 0, maxIdx);
      }
      function renderInstrumentList() {
        addInstrumentBtn.disabled = !tracksAbsNotes.length;
        instrumentListEl.innerHTML = "";
        if (!instruments.length) {
          const empty = document.createElement("div");
          empty.className = "pill";
          empty.textContent = "No instruments added yet.";
          instrumentListEl.appendChild(empty);
          return;
        }
        instruments.forEach((inst, idx) => {
          const row = document.createElement("div");
          row.className = "instrument-row";
          const label = document.createElement("span");
          label.className = "pill";
          label.textContent = `#${idx + 1}`;
          const nameInput = document.createElement("input");
          nameInput.type = "text";
          nameInput.className = "instrument-name";
          nameInput.placeholder = "Instrument name";
          nameInput.value = inst.name;
          nameInput.addEventListener("input", (e) =>
            updateInstrumentName(inst.id, e.target.value)
          );
          const trackSel = document.createElement("select");
          trackSel.innerHTML = trackSelect.innerHTML;
          trackSel.value = String(inst.trackIndex);
          trackSel.addEventListener("change", (e) =>
            updateInstrumentTrack(
              inst.id,
              parseInt(e.target.value, 10) || 0
            )
          );
          const removeBtn = document.createElement("button");
          removeBtn.className = "mini-btn";
          removeBtn.textContent = "Remove";
          removeBtn.addEventListener("click", () =>
            removeInstrument(inst.id)
          );
          row.appendChild(label);
          row.appendChild(nameInput);
          row.appendChild(trackSel);
          row.appendChild(removeBtn);
          instrumentListEl.appendChild(row);
        });
      }
      function addInstrument(trackIndex = null, name = "") {
        if (!tracksAbsNotes.length) return;
        const nextTrack =

        setZoomLevel(zoom - 1, currentPlayheadTime())
      );
      tlResetBtn.addEventListener("click", () => {
        zoom = 1;
        windowStart = 0;
        setZoomLevel(1, 0);
        selectedIndex = -1;
        tlSelectedEl.textContent = "None";
        setPlayheadByTime(0);
        renderTimeline();
      });
      tlScrub.addEventListener("input", () => {
        if (!currentMappedNotes.length) return;
        const t = currentPlayheadTime();
        setPlayheadByTime(t);
        let bestIdx = 0,
          bestDist = Infinity;
        for (let i = 0; i < mappedStartTimes.length; i++) {
          const d = Math.abs(mappedStartTimes[i] - t);
          if (d < bestDist) {
            bestDist = d;
            bestIdx = i;
          }
        }
        selectedIndex = bestIdx;
        const g = currentMappedNotes[bestIdx];
        const names = g.notes.map((n) => noteLabel(n)).join(" + ");
        const delayStr = `${g.delaySpaces} ${delaySpacesToEmoji(
          g.delaySpaces
        )}`;
        tlSelectedEl.textContent = `${
          bestIdx + 1
        }: ${names} • delay ${delayStr}`;
        renderTimeline();
      });
      tlStepBackBtn.addEventListener("click", () => stepSelection(-1));
      tlStepFwdBtn.addEventListener("click", () => stepSelection(1));
      timelineEl.addEventListener("click", (e) => {
        if (!currentMappedNotes.length) return;
        const rect = timelineEl.getBoundingClientRect();
        const x01 = clamp((e.clientX - rect.left) / rect.width, 0, 1);
        const t = xToTime(x01);
        setPlayheadByTime(t);
        let bestIdx = 0,
          bestDist = Infinity;
        for (let i = 0; i < mappedStartTimes.length; i++) {
          const d = Math.abs(mappedStartTimes[i] - t);
          if (d < bestDist) {
            bestDist = d;
            bestIdx = i;
          }
        }
        selectedIndex = bestIdx;
        const g = currentMappedNotes[bestIdx];
        const names = g.notes.map((n) => noteLabel(n)).join(" + ");
        const delayStr = `${g.delaySpaces} ${delaySpacesToEmoji(
          g.delaySpaces
        )}`;
        tlSelectedEl.textContent = `${
          bestIdx + 1
        }: ${names} • delay ${delayStr}`;
        renderTimeline();
      });
      timelineEl.addEventListener(
        "wheel",
        (e) => {
          if (!currentMappedNotes.length) return;
          e.preventDefault();
          const rect = timelineEl.getBoundingClientRect();
          const x01 = clamp((e.clientX - rect.left) / rect.width, 0, 1);
          const anchor = xToTime(x01);
          const delta = Math.sign(e.deltaY);
          const nextZoom = clamp(zoom + (delta > 0 ? -1 : 1), 1, 20);
          setZoomLevel(nextZoom, anchor);
        },
        { passive: false }
      );
      timelineEl.addEventListener("mousedown", (e) => {
        if (!currentMappedNotes.length) return;
        dragging = true;
        dragStartX = e.clientX;
        dragStartWindowStart = windowStart;
        timelineEl.style.cursor = "grabbing";
      });
      window.addEventListener("mousemove", (e) => {
        if (!dragging) return;
        const rect = timelineEl.getBoundingClientRect();
        const dx = e.clientX - dragStartX;
        const dt = -(dx / rect.width) * windowDuration;
        windowStart = clamp(
          dragStartWindowStart + dt,
          0,
          Math.max(0, mappedDuration - windowDuration)
        );
        renderTimeline();
      });
      window.addEventListener("mouseup", () => {
        if (!dragging) return;
        dragging = false;
        timelineEl.style.cursor = "default";
      });
      // ===== MIDI Loading =====
      midiFileInput.addEventListener("change", (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          try {
            currentMidi = new Midi(reader.result);
          } catch {
            alert("Error parsing MIDI file");
            return;
          }
          tracksAbsNotes = currentMidi.tracks.map((t, ti) => {
            return t.notes
              .map((n) => ({
                midi: n.midi,
                time: n.time,
                duration: n.duration,
                trackIndex: ti,
              }))
              .sort((a, b) => a.time - b.time);
          });
          trackSelect.innerHTML = "";
          currentMidi.tracks.forEach((t, i) => {
            const opt = document.createElement("option");
            opt.value = i;
            opt.textContent =
              t.name && t.name.trim() ? t.name.trim() : `Track ${i + 1}`;
            trackSelect.appendChild(opt);
          });
          currentSelectedTrackIdx = 0;
          trackSelect.selectedIndex = 0;
          syncInstrumentsToTracks();
          refreshModeUi();
          previewBtn.disabled = false;
          updateBpmInfo();
          rebuildMappedFromMode();
        };
        reader.readAsArrayBuffer(file);
      });
      trackSelect.addEventListener("change", () => {
        currentSelectedTrackIdx = parseInt(trackSelect.value, 10) || 0;
        rebuildMappedFromMode();
      });
      addInstrumentBtn.addEventListener("click", () => addInstrument());
      trackMode.addEventListener("change", handleTrackModeChange);
      chordModeSelect.addEventListener("change", rebuildMappedFromMode);
      // ===== BPM apply =====
      function applyBpmAndRebuild() {
        updateBpmInfo();
        if (currentMidi) rebuildMappedFromMode();
      }
      applyBpmBtn.addEventListener("click", applyBpmAndRebuild);
      bpmInput.addEventListener("change", applyBpmAndRebuild);
      bpmInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") applyBpmAndRebuild();
      });
      // ===== Keyboard shortcuts =====
      window.addEventListener("keydown", (e) => {
        if (
          e.target &&
          (e.target.tagName === "INPUT" || e.target.tagName === "SELECT")
        )
          return;
        if (e.code === "Space") {
          e.preventDefault();
          if (!playBtn.disabled) playBtn.click();
        } else if (e.key === "ArrowLeft") {
          e.preventDefault();
          stepSelection(-1);
        } else if (e.key === "ArrowRight") {
          e.preventDefault();
          stepSelection(1);
        } else if (e.key === "Escape") {
          selectedIndex = -1;
          tlSelectedEl.textContent = "None";
          renderTimeline();
        }
      });
      // Init
      refreshModeUi();
      renderInstrumentList();
      updateBpmInfo();
      rebuildMappedFromMode();
    </script>
  </body>
</html>
