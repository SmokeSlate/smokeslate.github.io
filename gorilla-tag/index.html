<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gorilla Tag Map Share - Browse Maps</title>
  <style>
    body {
      font-family: "Open Sans", sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
      background-color: white;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
    h1 {
      color: #333;
      font-size: 2rem;
      margin-bottom: 20px;
    }
    .map-list {
      list-style: none;
      padding: 0;
    }
    .map-item {
      padding: 20px;
      margin-bottom: 15px;
      border-bottom: 1px solid #ddd;
    }
    .map-item h3 {
      margin: 0;
      font-size: 1.5rem;
    }
    .map-item p {
      margin: 5px 0;
    }
    .nav {
      margin-bottom: 20px;
    }
    .nav a {
      text-decoration: none;
      color: #4CAF50;
      margin-right: 10px;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="nav">
    <a href="submit.html">Submit Map</a>
    <a href="help.html">Help</a>
    <a href="index.html">Browse Maps</a>
    <h6 style="size: .1em; line-height: .01; line-height-step: .01;" >not official</h6>
  </div>

  <h1>Browse Gorilla Tag Maps</h1>
  
  <ul id="mapList" class="map-list"></ul>
</div>

<script>
  document.addEventListener('DOMContentLoaded', function() {
  fetch('https://script.google.com/macros/s/AKfycbz-iNzGiAdAmrt2c7-ftSkAUavng58uO7zEptWfFu8pcSw0Vilz29jDcHtZOVXW1xMf/exec')
    .then(response => {
      if (!response.ok) {
        throw new Error('Network response was not ok');
      }
      return response.text(); // Change this to text to inspect raw output
    })
    .then(text => {
      const data = JSON.parse(text); // Manually parse the text into JSON
      const mapList = document.getElementById('mapList');

      data.forEach(map => {
        const mapItem = document.createElement('li');
        mapItem.className = 'map-item';

        const title = document.createElement('h3');
        title.textContent = map.title || 'Untitled map';
        const author = document.createElement('p');
        author.textContent = 'Author: ' + (map.author || 'Unknown');
        const linkRow = document.createElement('p');
        try {
          const url = new URL(map.link);
          if (url.protocol !== 'https:' || url.username || url.password || !(url.hostname === 'mod.io' || url.hostname.endsWith('.mod.io'))) throw new Error('Invalid map link');
          const link = document.createElement('a');
          link.href = url.href; link.target = '_blank'; link.rel = 'noopener noreferrer';
          link.textContent = 'View on Mod.io'; linkRow.appendChild(link);
        } catch (_) { linkRow.textContent = 'Map link unavailable'; }
        const date = document.createElement('small');
        const submitted = new Date(map.submissionDate);
        date.textContent = 'Submitted on: ' + (Number.isNaN(submitted.getTime()) ? 'Unknown date' : submitted.toLocaleDateString());
        mapItem.append(title, author, linkRow, date);

        mapList.appendChild(mapItem);
      });
    })
    .catch(error => console.error('Error:', error));
});

</script>

</body>
</html>
