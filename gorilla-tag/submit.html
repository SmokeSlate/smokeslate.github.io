<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gorilla Tag Map Share - Submit Map</title>
  <style>
    body {
      font-family: "Open Sans", sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 600px;
      margin: 50px auto;
      padding: 20px;
      background-color: white;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
    h1 {
      color: #333;
      font-size: 2rem;
      margin-bottom: 20px;
    }
    form {
      display: flex;
      flex-direction: column;
    }
    label {
      font-weight: bold;
      margin: 10px 0 5px;
    }
    input, button {
      padding: 10px;
      font-size: 1rem;
      margin-bottom: 20px;
    }
    button {
      background-color: #4CAF50;
      color: white;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background-color: #45a049;
    }
    .message {
      color: green;
    }
    .nav {
      margin-bottom: 20px;
    }
    .nav a {
      text-decoration: none;
      color: #4CAF50;
      margin-right: 10px;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="nav">
    <a href="submit.html">Submit Map</a>
    <a href="help.html">Help</a>
    <a href="index.html">Browse Maps</a>
    <h6 style="size: .1em; line-height: .01; line-height-step: .01;" >not official</h6>
  </div>

  <h1>Submit Your Gorilla Tag Map</h1>
  
  <form id="mapForm">
    <label for="title">Map Title:</label>
    <input type="text" id="title" name="title" required>

    <label for="author">Author Name:</label>
    <input type="text" id="author" name="author" required>

    <label for="link">Mod.io Link (click on this for shareing instructions: <a href="help.html">Help</a>):</label>
    <input type="url" id="link" name="link" required>

    <button type="submit">Submit Map</button>
  </form>

  <div class="message" id="message"></div>
</div>

<script>
  const form = document.getElementById('mapForm');
  const messageDiv = document.getElementById('message');

  let submitting = false;
  form.addEventListener('submit', async function(event) {
    event.preventDefault();
    if (submitting) return;
    const button = form.querySelector('button[type="submit"]');
    const formData = {
      title: document.getElementById('title').value,
      author: document.getElementById('author').value,
      link: document.getElementById('link').value
    };
    submitting = true;
    button.disabled = true;
    messageDiv.textContent = 'Submitting map...';
    try {
      const response = await fetch('https://script.google.com/macros/s/AKfycbz-iNzGiAdAmrt2c7-ftSkAUavng58uO7zEptWfFu8pcSw0Vilz29jDcHtZOVXW1xMf/exec', {
        method: 'POST', body: JSON.stringify(formData),
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        redirect: 'follow', mode: 'cors'
      });
      if (response.type === 'opaque' || !response.ok) throw new Error('The server did not confirm submission.');
      const data = await response.json();
      if (data?.success !== true) throw new Error(data?.message || 'The server did not confirm submission.');
      messageDiv.textContent = 'Map submitted successfully!';
      form.reset();
    } catch (error) {
      messageDiv.textContent = 'Unable to confirm submission. Your entries have been kept. Check with the site owner before retrying.';
    } finally {
      submitting = false;
      button.disabled = false;
    }
  });

</script>

</body>
</html>
