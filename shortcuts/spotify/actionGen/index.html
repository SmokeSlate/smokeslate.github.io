<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Spotify Shortcut Action Builder</title>
<style>
body{font-family:system-ui,sans-serif;background:#0d1117;color:#f0f6fc;margin:2em}
h1{font-size:1.5em;margin-bottom:.5em}
label{display:block;margin-top:1em}
input,select{width:100%;padding:.5em;border:1px solid #30363d;border-radius:4px;background:#161b22;color:#fff}
.toggles{display:flex;gap:1em;margin-top:.5em}
button{margin-top:1.5em;padding:.7em 1.5em;font-size:1em;border:none;border-radius:5px;background:#238636;color:#fff;cursor:pointer}
textarea{width:100%;height:250px;margin-top:1em;padding:.5em;border:1px solid #30363d;border-radius:4px;background:#161b22;color:#fff}
.note{font-size:.9em;opacity:.8;margin-top:.5em}
</style>
</head>
<body>
<h1>🎵 Spotify Shortcut Action Builder</h1>
<p class="note">Paste a Spotify link or ID → set options → click <b>Generate</b>. The JSON copies & opens Shortcuts automatically.</p>

<label>Action Title</label>
<input id="title" placeholder="Play MY SONGS">

<label>Spotify Type</label>
<select id="type">
  <option value="playlist" selected>Playlist</option>
  <option value="track">Track</option>
  <option value="album">Album</option>
</select>

<label>Spotify Link or ID</label>
<input id="link" placeholder="https://open.spotify.com/playlist/3I7k...">

<div class="toggles">
  <label><input type="checkbox" id="shuffle"> Shuffle</label>
  <label><input type="checkbox" id="repeat" checked> Repeat</label>
  <label><input type="checkbox" id="show" checked> Show When Run</label>
</div>

<button id="build">Generate and Send to Shortcuts</button>

<textarea style='display:none;' id="output" placeholder="Generated JSON appears here..."></textarea>

<script src="./intent-bundle.js"></script>
<script>
// ---------- Embedded donor (Liked Songs) ----------
const donor={
  "WFWorkflowActionIdentifier": "is.workflow.actions.sirikit.donation.handle",
  "WFWorkflowActionParameters": {
    "IntentData": {
      "__type__": "data",
      "__value__": ""
    },
    "ForceExecutionOnPhone": false,
    "UUID": "A4325B61-5876-4B28-9D4B-1E5D6EF05179",
    "ShowWhenRun": false
  }
};

// ---------- Utility helpers ----------
function parseSpotifyLink(value) {
  value = String(value || '').trim();
  if (!value) return null;
  let type = document.getElementById('type').value;
  let id = value;
  if (value.startsWith('spotify:')) {
    const parts = value.split(':');
    if (parts.length !== 3) return null;
    [, type, id] = parts;
  } else if (/^https?:/i.test(value)) {
    try {
      const url = new URL(value);
      if (url.protocol !== 'https:' || url.hostname !== 'open.spotify.com' || url.username || url.password) return null;
      const parts = url.pathname.split('/').filter(Boolean);
      if (parts[0]?.startsWith('intl-')) parts.shift();
      if (parts.length !== 2) return null;
      [type, id] = parts;
    } catch (_) { return null; }
  }
  return ['playlist', 'track', 'album'].includes(type) && /^[A-Za-z0-9]{22}$/.test(id) ? { type, id } : null;
}

function buildAction(){
  const title=document.getElementById("title").value.trim()||"Untitled";
  const shuffle=document.getElementById("shuffle").checked;
  const repeat=document.getElementById("repeat").checked;
  const show=document.getElementById("show").checked;

  const parsed=parseSpotifyLink(document.getElementById("link").value);
  if(!parsed){alert("Invalid Spotify link or ID.");return;}
  const uri=`spotify:${parsed.type}:${parsed.id}`;
  document.getElementById("type").value=parsed.type;

  let obj=structuredClone(donor);
  obj.WFWorkflowActionParameters.ShowWhenRun=show;

  try {
    if (!window.SpotifyIntent) throw new Error('Intent serializer did not load. Reload and try again.');
    obj.WFWorkflowActionParameters.IntentData.__value__ = window.SpotifyIntent.build({ uri, title, shuffle, repeat });
  } catch (error) {
    alert(error.message || 'Unable to build the Spotify action.');
    return;
  }

  const out=JSON.stringify(obj,null,2);
  document.getElementById("output").value=out;
  navigator.clipboard.writeText(out).catch(()=>{});

  // === Auto-launch Shortcuts ===
  const payload=encodeURIComponent('{"actions":['+JSON.stringify(obj)+']}');
  location.href='shortcuts://run-shortcut?name=Action%20Editor&input='+payload;
}

document.getElementById("build").addEventListener("click",buildAction);
</script>
</body>
</html>
